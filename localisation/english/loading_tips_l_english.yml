l_english:
LOADING_TIP_0: "In pursuit of a new world, no cost is too great.\n- Salem"
LOADING_TIP_1: "Are you surprised? This world is quite literally godless. These Humans have no one to guide them. Perhaps that's all they need.\n- Salem"
LOADING_TIP_2: "We could become the gods of this world. Our powers surpass all others. Our souls transcend death.\n- Salem"
LOADING_TIP_3: "We can mold these lands into whatever we want, what you want, create the paradise that the old Gods could not.\n- Salem"
LOADING_TIP_4: "You said we needed to bring Humanity together. In order to do that, we have to spread our word, and destroy those who will deny it.\n- Salem"
LOADING_TIP_5: "Yes, the world of Remnant is indeed a dangerous place. But the four Kingdoms stand as beacons of hope, as safe havens from the darkness that surrounds them.\n- Salem"
LOADING_TIP_6: "The world of Remnant is a dangerous place, particularly for man. In the countless years that Humanity has roamed the planet, civilizations have grown and fallen. But four have withstood the test of time.\n- Salem"
LOADING_TIP_7: "But perhaps victory is in the simpler things that you've long forgotten; things that require a smaller, more honest soul.\n- Ozpin"
LOADING_TIP_8: "Do not hesitate to destroy everything in your path... or you will die.\n- Ozpin"
LOADING_TIP_9: "No one voice is louder than the others, and no voice may be silent without the rest.\n- Ozpin"
LOADING_TIP_10: "If the people of Remnant are to speak, then they shall do so together... or not at all.\n- Ozpin"
LOADING_TIP_11: "All are expected to serve humanity... and never succumb to the darkness.\n- Ozpin"
LOADING_TIP_12: "It's true that all of this began with war. But, it is peace that has served to shepherd humanity on its ascension to greatness.\n- Ozpin"
LOADING_TIP_13: "May we never stray from that path.\n- Ozpin"
LOADING_TIP_14: "New world order. No. When Salem gets all four Relics, there will be no world left at all.\n- Ozpin"
LOADING_TIP_15: "Don't you get it? She's been alive longer than you can comprehend. All she craves now is release. Death.\n- Ozpin"
LOADING_TIP_16: "Now, while this must feel like ancient history to many of you, it is imperative to remember that these are relatively recent events!\n- Doctor Oobleck"
LOADING_TIP_17: "Why, the repercussions of the uprising can still be seen to this day!\n- Doctor Oobleck"
LOADING_TIP_18: "As a Huntsman, it is my job to protect the people. I believe I can make a much larger impact if I do it with my mind.\n- Doctor Oobleck"
LOADING_TIP_19: "Monsters, demons, prowlers of the night. Yes, the creatures of Grimm have many names.\n- Peter Port"
LOADING_TIP_20: "Our planet is absolutely teeming with creatures that would love nothing more than to tear you to pieces!\n- Peter Port"
LOADING_TIP_21: "Fear is like any other emotion. It comes and goes. It's all in how you handle it.\n- Peter Port"
LOADING_TIP_22: "Why must your answer to everything involve a triumphant display of military bravado!?\n- Glynda Goodwitch"
LOADING_TIP_23: "You treat every situation like it's a contest of measuring di—!\n- Glynda Goodwitch"
LOADING_TIP_24: "But ask yourself this: do you honestly believe your children can win a war?\n- James Ironwood"
LOADING_TIP_25: "The people of Vale needed someone to protect them, someone who would act.\n- James Ironwood"
LOADING_TIP_26: "When they look to the sky and see my fleet, they feel safe, and our enemies will feel our strength.\n- James Ironwood"
LOADING_TIP_27: "Discreet wasn't working. I'm here because this is what was necessary.\n- James Ironwood"
LOADING_TIP_28: "An ancient and terrible evil lies outside of our Kingdom. It goes by the name of Salem.\n- James Ironwood"
LOADING_TIP_29: "It was responsible for the destruction of Beacon, the attack on Haven, and the recent attacks on Mantle.\n- James Ironwood"
LOADING_TIP_30: "Salem seeks only to divide us. To turn us against each other.\n- James Ironwood"

LOADING_TIP_31: "Good luck, Dylan!\n- Cordy"
LOADING_TIP_32: "Special thanks to Cordy for the help with the mod.\n- Dylan"

