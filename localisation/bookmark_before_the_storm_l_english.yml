l_english:
before_the_storm_name:0 "Before The Storm"
before_the_storm_desc:0 "In the lead-up to the Great War, Remnant was a world marked by rising tensions and ideological conflicts among its four kingdoms: Vale, Vacuo, Mantle, and Mistral. Each kingdom had its own unique culture, strengths, and challenges, but growing disputes over territory, resources, and governance began to strain their relationships.\n\nMantle and Mistral formed a strategic alliance, trading resources and adopting similar policies, including the suppression of the arts and self-expression to maintain control over their populations. This alliance, however, was viewed with suspicion and disapproval by Vale and Vacuo, who valued individual freedoms and cultural expression.\n\nAs these tensions escalated, the kingdoms’ differing ideologies and ambitions set the stage for conflict. The first battle of the Great War was sparked by a riot between settlers from Vale and Mistral on the eastern coast of Sanus1. This clash quickly drew in Mantle and Vacuo, leading to a decade-long war that reshaped the political landscape of Remnant."
before_the_storm_VAL:0 "The Kingdom of Vale, located on the northeastern end of the continent of Sanus, was known for its natural defenses, including shallow waters to the west and steep mountains to the east. These geographic features made Vale a relatively safe haven from the Grimm, allowing its citizens to focus more on their daily lives rather than constant survival.

Before the Great War, Vale was a prosperous kingdom with a strong sense of community and stability. It was governed by a ruling council and was home to Beacon Academy, one of the four main Huntsman Academies of Remnant1. The kingdom’s capital, also named Vale, was a bustling city that served as a cultural and economic hub.

Tensions between the four kingdoms of Remnant were high in the century leading up to the Great War. Vale, along with Vacuo, eventually found itself in conflict with Mantle (now Atlas) and Mistral. The war was sparked by disputes over territory and differing ideologies, with Vale disapproving of Mantle and Mistral’s oppressive practices.

Despite the challenges, Vale’s strategic location and strong leadership helped it endure the conflict, ultimately playing a crucial role in the war’s resolution."
before_the_storm_ATL:0 "The Kingdom of Mantle, located in the frigid northern regions of Remnant, was founded by settlers who braved the harsh, cold conditions. These settlers quickly adapted to their environment, developing advanced Dust technologies to survive and thrive. The kingdom’s harsh climate provided a natural defense against the Grimm, allowing Mantle to focus on technological and industrial advancements.

In the century leading up to the Great War, Mantle formed a strategic alliance with the Kingdom of Mistral. This partnership was mutually beneficial, with Mistral providing supplies and Mantle offering expertise in settling cold climates. Mantle’s focus on technological innovation accelerated during this period, particularly in the development of new weapons and Dust applications.

As tensions between the four kingdoms escalated, Mantle and Mistral found themselves in conflict with Vale and Vacuo. The Great War, which lasted for a decade, saw Mantle leveraging its technological advancements to gain an edge in the conflict. Despite the war’s challenges, Mantle’s resilience and innovation played a crucial role in its efforts during the war."
before_the_storm_MIS:0 "The Kingdom of Mistral, located on the continent of Anima, was known for its rich cultural heritage and diverse landscapes. Before the Great War, Mistral was an expansive empire that had conquered various cultures across Anima. This kingdom was renowned for its arts, philosophy, and martial prowess, although it later adopted Mantle’s policy of suppressing self-expression and the arts.

Mistral formed a strategic alliance with Mantle, trading supplies and receiving guidance on settling the snowy northern regions of Anima. This alliance strengthened both kingdoms, but also contributed to rising tensions with Vale and Vacuo, eventually leading to the Great War.

Despite the war’s challenges, Mistral’s cultural identity and strategic alliances played a crucial role in its history and development."
before_the_storm_VAC:0 "The Kingdom of Vacuo, located on the western end of the continent of Sanus, was originally a lush oasis with abundant resources and natural barriers that protected its inhabitants. This favorable environment allowed Vacuo’s people to flourish, attracting nomads from the surrounding harsh desert.

However, the kingdom’s prosperity also led to complacency, making it vulnerable to exploitation by other kingdoms. Over time, unchecked human activity and external pressures transformed Vacuo into a barren wasteland. Despite these challenges, the people of Vacuo adapted to their harsh environment, becoming resilient and resourceful.

Before the Great War, Vacuo’s strategic location and vast Dust deposits made it a target for other kingdoms, particularly Mantle and Mistral. These kingdoms sought to control Vacuo’s resources, leading to conflicts that contributed to the tensions culminating in the Great War."
before_the_storm_GRM:0 "Salem is an ancient and enigmatic figure in the world of Remnant, known for her immense power and tragic past. Long before the Great War and the establishment of the four kingdoms, Salem lived in an age when humanity coexisted with the God of Light and the God of Darkness, and all humans possessed the ability to perform magic.

Salem’s story began with her being isolated in a tower by her cruel father. Desperate for freedom, she sought the help of the gods, which led to a series of tragic events. After defying the gods and attempting to bring her lover, Ozma, back to life, she was cursed with immortality. This curse drove her to seek power and control, eventually leading her to master the Grimm and become a formidable force in Remnant.

Salem and Ozma, once united in love, became adversaries over time. Their conflict spanned centuries, shaping much of Remnant’s history. Salem’s ultimate goal became to gather the Relics and summon the gods back to Remnant, hoping that their return would end her immortality."
before_the_storm_WTF:0 "The White Fang is a Faunus organization in the world of Remnant, originally founded as a peaceful activist group following the Faunus Rights Revolution. The organization was established by Ghira Belladonna with the aim of promoting equality and improving relations between Humans and Faunus. Initially, the White Fang engaged in nonviolent protests, such as mass rallies and boycotts, to combat discrimination and advocate for civil rights."
