TCG_grimm_territory:0 "Grimm Territory"
TCG_grimm_territory_desc:0 "In the world of RWBY, Grimm are terrifying creatures driven solely by their primal instincts. They lack the ability to build or think, functioning purely as mindless killing machines. Their sole purpose is to prey on all those who walk the world, driven by an insatiable hunger for destruction. These relentless beings embody chaos and fear, making them a constant threat to humanity and all living creatures."
